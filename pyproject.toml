[project]
name = "cookiecutter-mlops-pypackage"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "TouyeAchille", email = "touyejunior@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "loguru>=0.7.3",
]

[project.scripts]
cookiecutter-mlops-pypackage = "cookiecutter_mlops_pypackage:main"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
]
notebook = [
    "ipykernel>=7.4.0",
    "nbformat>=5.11.1",
]
